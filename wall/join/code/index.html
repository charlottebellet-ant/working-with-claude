<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Build Wall · Claude Code</title>
<style>
  :root{
    /* Claude brand: Ivory canvas, Slate ink, Clay accent, warm tints for the cards */
    --canvas:#F0EEE6; --card:#FAF9F5; --ink:#141413; --muted:#5E5D59; --line:#E3DFD3;
    --accent:#D97757; --accent-ink:#FAF9F5; --accent-soft:#F6E3D7;
    --tint-clay:#F5DCCB; --tint-oat:#EAE3D1; --tint-sage:#DCE5D6; --tint-sky:#D8E2EC; --tint-sand:#F2E5C4;
    --radius:22px; --shadow:0 10px 30px rgba(20,20,19,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;overflow-x:hidden}
  .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 22px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--muted);box-shadow:0 2px 8px rgba(20,20,19,.05)}
  .pill.session{background:var(--tint-oat);color:var(--ink)}
  h1{font-size:clamp(28px,7.5vw,38px);line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;font-weight:800}
  h1 em{font-style:normal;color:var(--accent)}
  .hint{color:var(--muted);margin:0 0 22px;font-size:15px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px;letter-spacing:.02em;text-transform:uppercase}
  input,textarea{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;resize:none}
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(217,119,87,.18);background:#fff}
  .field{margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  button.primary{width:100%;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:16px;padding:16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 8px 20px rgba(217,119,87,.35);transition:transform .12s,box-shadow .12s,opacity .2s;position:relative}
  button.primary:active{transform:scale(.98)}
  button.primary[disabled]{opacity:.6;cursor:default}
  .err{color:#C0392B;font-size:14px;margin:10px 0 0;min-height:18px}
  .mine{margin-top:22px}
  .mine h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;font-weight:700}
  .chips{display:flex;flex-direction:column;gap:10px}
  .chip{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:0 2px 10px rgba(20,20,19,.05);animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
  .chip .t{flex:1;font-weight:600;font-size:16px;line-height:1.35}
  .chip .swatch{width:10px;align-self:stretch;border-radius:6px;flex:none}
  .chip button{border:0;background:var(--canvas);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;flex:none}
  .chip button:hover{background:#FFE0DC;color:#C0392B}
  @keyframes pop{0%{transform:scale(.7) translateY(10px);opacity:0}100%{transform:none;opacity:1}}
  .empty{color:var(--muted);font-size:15px;background:transparent;border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center}
  .live{margin-top:auto;padding-top:26px;text-align:center;color:var(--muted);font-size:14px}
  .live strong{color:var(--ink);font-size:22px;font-weight:800;display:block;line-height:1.1}
  .live .n{font-variant-numeric:tabular-nums;transition:transform .2s}
  .live .n.bump{transform:scale(1.25);color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;left:50%;top:60%;width:10px;height:14px;border-radius:3px;animation:fly 1.1s cubic-bezier(.1,.8,.3,1) forwards;opacity:0}
  @keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  .spark{display:inline-block;width:var(--spark,26px);height:var(--spark,26px);color:var(--accent);vertical-align:middle;transform-origin:50% 50%;animation:spark-in .9s cubic-bezier(.34,1.56,.64,1) both,spark-idle 7s ease-in-out 1.4s infinite}
  .spark svg{width:100%;height:100%;display:block}
  .spark.pop{animation:spark-in .9s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes spark-in{0%{transform:scale(0)}55%{transform:scale(1.18)}75%{transform:scale(.94) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes spark-idle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(2deg)}}
  .working{--s:22px;display:inline-block;width:var(--s);height:var(--s);background:currentColor;-webkit-mask:url(../../lib/spark-working.svg) 0 0/var(--s) auto no-repeat;mask:url(../../lib/spark-working.svg) 0 0/var(--s) auto no-repeat;animation:working .93s steps(28) infinite;vertical-align:-4px;margin-right:8px}
  .working[hidden]{display:none}
  @keyframes working{to{-webkit-mask-position:0 calc(var(--s) * -28);mask-position:0 calc(var(--s) * -28)}}
  .clawd{display:inline-block;width:27px;height:18px;image-rendering:pixelated;animation:clawd-bob 1.6s ease-in-out infinite;vertical-align:middle;margin-left:6px}
  .clawd svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  @keyframes clawd-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.spark,.working,.clawd{animation:none}}
</style>
</head>
<body>

    <span class="pill"><i class="spark" style="--spark:20px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" >

  </div>

  <h1 id="q">What are you going to build with Claude Code today?</h1>
  <p class="hint">A feature, a fix, an agent, a tool for your repo… one idea per card.</p>

  <form class="card" id="f" autocomplete="off">
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" name="name" maxlength="40" placeholder="e.g. Priya from Finance" required>
    </div>
    <div class="field">
      <div class="row"><label for="text">Your idea</label><span class="count" id="count">0 / 140</span></div>
      <textarea id="text" name="text" maxlength="140" rows="3" placeholder="I'm going to build…" required></textarea>
    </div>
    <button class="primary" id="go" type="submit"><span class="working" id="goWork" hidden></span><span id="goLabel">Add it to the wall →</span></button>
    <p class="err" id="err" aria-live="polite"></p>
  </form>

  <section class="mine">
    <h2>Your ideas <span id="mineN"></span></h2>
    <div class="chips" id="chips"><div class="empty">Nothing yet. Add your first idea above, then add another.</div></div>
  </section>

  <div class="live"><strong><span class="n" id="liveN">–</span> <span id="liveWord">ideas</span> on the wall</strong><span id="livePeople"></span></div>
  <div class="toast" id="toast"></div>
  <div class="confetti" id="confetti"></div>

<script src="../../config.js"></script>
<script src="../../lib/api.js"></script>
<script>
(() => {
  const KEY = 'code';
  const BW = window.BuildWall;
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const uuid = BW.uuid;
  let client = store.get('bw-client', null);
  if (!client) { client = uuid(); store.set('bw-client', client); }
  const mineKey = 'bw-mine-' + KEY;
  let mine = store.get(mineKey, []);
  const fills = ['var(--tint-clay)', 'var(--tint-oat)', 'var(--tint-sage)', 'var(--tint-sand)', 'var(--tint-sky)'];

  $('name').value = store.get('bw-name', '');
  const textEl = $('text');
  textEl.addEventListener('input', () => { $('count').textContent = textEl.value.length + ' / 140'; });
  textEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } });

  function renderMine() {
    const box = $('chips');
    box.textContent = '';
    $('mineN').textContent = mine.length ? '(' + mine.length + ')' : '';
    if (!mine.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nothing yet. Add your first idea above, then add another.'; box.appendChild(d); return; }
    mine.slice().reverse().forEach((m, i) => {
      const c = document.createElement('div'); c.className = 'chip';
      const s = document.createElement('span'); s.className = 'swatch'; s.style.background = fills[(mine.length - 1 - i) % fills.length];
      const t = document.createElement('div'); t.className = 't'; t.textContent = m.text;
      const b = document.createElement('button'); b.type = 'button'; b.title = 'Remove'; b.textContent = '×';
      b.addEventListener('click', () => remove(m.id));
      c.append(s, t, b); box.appendChild(c);
    });
  }
  async function remove(id) {
    try { await BW.removeOwn(id, client); } catch {}
    mine = mine.filter((m) => m.id !== id); store.set(mineKey, mine); renderMine(); refresh();
  }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
  function confetti() {
    const box = $('confetti'); box.textContent = '';
    const colors = ['#D97757', '#EAB48F', '#8FA98C', '#E8C874', '#8FA9C4', '#141413'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('i');
      const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
      p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', (Math.sin(a) * d - 160) + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg'); p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 80) + 'ms'; box.appendChild(p);
    }
    setTimeout(() => { box.textContent = ''; }, 1400);
  }
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('name').value.trim(), text = textEl.value.trim();
    $('err').textContent = '';
    if (!name) { $('err').textContent = 'Add your name first.'; $('name').focus(); return; }
    if (!text) { $('err').textContent = 'Write what you are going to build.'; textEl.focus(); return; }
    store.set('bw-name', name);
    const btn = $('go'); btn.disabled = true; $('goWork').hidden = false; $('goLabel').textContent = 'Adding…';
    const id = uuid();
    try {
      await BW.add({ id, session: KEY, name, text, client });
      mine.push({ id, text }); store.set(mineKey, mine); renderMine();
      textEl.value = ''; $('count').textContent = '0 / 140';
      confetti(); toast("It's on the wall ✨"); refresh();
      textEl.focus();
    } catch (e) { $('err').textContent = e && e.status ? e.message : 'No connection. Check the WiFi and try again.'; }
    finally { btn.disabled = false; $('goWork').hidden = true; $('goLabel').textContent = 'Add another idea →'; }
  });
  let lastCount = null;
  function setLive(count, people) {
    const n = $('liveN'); if (lastCount !== null && count !== lastCount) { n.classList.add('bump'); setTimeout(() => n.classList.remove('bump'), 250); }
    lastCount = count; n.textContent = count; $('liveWord').textContent = count === 1 ? 'idea' : 'ideas'; $('livePeople').textContent = people ? 'from ' + people + (people === 1 ? ' person' : ' people') : '';
  }
  async function refresh() { try { const d = await BW.stats(KEY); setLive(d.count, d.people); } catch {} }
  if (!BW.configured) { $('err').textContent = 'This wall is not connected to its database yet (config.js).'; $('go').disabled = true; }
  renderMine(); refresh(); setInterval(refresh, 12000);
})();
</script>
</body>
</html>
